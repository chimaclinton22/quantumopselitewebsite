<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academy — QUANTUM OPS ELITE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    :root {
      --bg-primary: #020617;
      --bg-card: rgba(15, 23, 42, 0.72);
      --brand-primary: #14B8A6;
      --bright-cyan: #22D3EE;
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --border: rgba(148, 163, 184, 0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: var(--bg-primary); color: var(--text-primary); }
    
    nav { position: fixed; top: 0; width: 100%; height: 80px; background: rgba(2,6,23,0.72); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 40px; z-index: 100; }
    .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-primary); font-weight: 800; font-size: 14px; }
    .brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--brand-primary), var(--bright-cyan)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--bg-primary); }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 14px; }
    .nav-links a.active { color: var(--bright-cyan); }
    
    .container { max-width: 1200px; margin: 120px auto 60px; padding: 0 20px; }
    .courses-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
    .course-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 32px; }
    .price { font-size: 24px; font-weight: 800; color: var(--bright-cyan); margin: 16px 0; }
    .enroll-btn { display: inline-block; width: 100%; text-align: center; background: var(--brand-primary); color: var(--bg-primary); padding: 12px; border-radius: 6px; text-decoration: none; font-weight: 700; margin-top: 16px; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-brand">
      <div class="brand-icon">QO</div>
      <div>QUANTUM OPS <span style="color:var(--bright-cyan)">ELITE</span></div>
    </a>
    <ul class="nav-links">
      <li><a href="platform.html">Platform</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="work.html">Work</a></li>
      <li><a href="academy.html" class="active">Academy</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    <div style="text-align: center; margin-bottom: 50px;">
      <h1 style="font-size: 40px; margin-bottom: 12px;">LEARN TO BUILD WHAT YOU IMAGINE</h1>
      <p style="color: var(--text-secondary);">Master modern web architecture, Supabase databases, and AI software engineering.</p>
    </div>

    <div id="courses-container" class="courses-grid">
      <div style="color: var(--text-secondary);">Loading courses...</div>
    </div>
  </div>

  <script>
    async function loadCourses() {
      const container = document.getElementById('courses-container');
      const { data: courses, error } = await supabaseClient
        .from('courses')
        .select('*')
        .eq('published', true)
        .order('sort_order', { ascending: true });

      if (error || !courses || courses.length === 0) {
        container.innerHTML = `<p style="color: var(--text-secondary);">No courses available at this time.</p>`;
        return;
      }

      container.innerHTML = courses.map(c => `
        <div class="course-card">
          <span style="color: var(--bright-cyan); font-size: 12px; text-transform: uppercase;">${c.level}</span>
          <h2 style="font-size: 22px; margin-top: 8px;">${c.title}</h2>
          <p style="color: var(--text-secondary); margin-top: 12px; font-size: 14px;">${c.description}</p>
          <div class="price">₦${Number(c.price).toLocaleString()}</div>
          <a href="contact.html?course=${encodeURIComponent(c.title)}" class="enroll-btn">ENROLL NOW</a>
        </div>
      `).join('');
    }

    loadCourses();
  </script>
</body>
</html>
