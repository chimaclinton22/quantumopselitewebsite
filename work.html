<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work — QUANTUM OPS ELITE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    :root {
      --bg-primary: #020617;
      --bg-card: rgba(15, 23, 42, 0.72);
      --brand-primary: #14B8A6;
      --bright-cyan: #22D3EE;
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --border: rgba(148, 163, 184, 0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: var(--bg-primary); color: var(--text-primary); }
    
    nav { position: fixed; top: 0; width: 100%; height: 80px; background: rgba(2,6,23,0.72); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 40px; z-index: 100; }
    .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-primary); font-weight: 800; font-size: 14px; }
    .brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--brand-primary), var(--bright-cyan)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--bg-primary); }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 14px; }
    .nav-links a.active { color: var(--bright-cyan); }
    
    .container { max-width: 1200px; margin: 120px auto 60px; padding: 0 20px; }
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 32px; }
    .project-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .project-img { width: 100%; height: 200px; object-fit: cover; background: #0F172A; }
    .project-body { padding: 24px; flex-grow: 1; }
    .tag { display: inline-block; background: rgba(20, 184, 166, 0.1); color: var(--bright-cyan); padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-bottom: 12px; }
    .project-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .project-desc { color: var(--text-secondary); font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    .btn-link { color: var(--bright-cyan); text-decoration: none; font-weight: 600; font-size: 14px; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-brand">
      <div class="brand-icon">QO</div>
      <div>QUANTUM OPS <span style="color:var(--bright-cyan)">ELITE</span></div>
    </a>
    <ul class="nav-links">
      <li><a href="platform.html">Platform</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="work.html" class="active">Work</a></li>
      <li><a href="academy.html">Academy</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    <h1 style="font-size: 40px; margin-bottom: 40px; text-align: center;">BUILT TO PROVE WHAT'S POSSIBLE</h1>
    
    <div id="projects-container" class="projects-grid">
      <div style="color: var(--text-secondary);">Loading portfolio projects...</div>
    </div>
  </div>

  <script>
    async function fetchProjects() {
      const container = document.getElementById('projects-container');
      const { data: projects, error } = await supabaseClient
        .from('portfolio_projects')
        .select('*')
        .eq('published', true)
        .order('sort_order', { ascending: true });

      if (error || !projects || projects.length === 0) {
        container.innerHTML = `<p style="color: var(--text-secondary);">No projects found or error loading data.</p>`;
        return;
      }

      container.innerHTML = projects.map(p => `
        <div class="project-card">
          <img src="${p.image_url || 'https://via.placeholder.com/600x300/0F172A/14B8A6?text=Quantum+Ops'}" class="project-img" alt="${p.title}">
          <div class="project-body">
            <span class="tag">${p.category || 'Engineering'}</span>
            <div class="project-title">${p.title}</div>
            <p class="project-desc">${p.description}</p>
            ${p.demo_url ? `<a href="${p.demo_url}" target="_blank" class="btn-link">LIVE DEMO →</a>` : ''}
          </div>
        </div>
      `).join('');
    }

    fetchProjects();
  </script>
</body>
</html>
