<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — QUANTUM OPS ELITE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    :root {
      --bg-primary: #020617;
      --bg-card: rgba(15, 23, 42, 0.72);
      --brand-primary: #14B8A6;
      --bright-cyan: #22D3EE;
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --border: rgba(148, 163, 184, 0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: var(--bg-primary); color: var(--text-primary); }
    
    nav { position: fixed; top: 0; width: 100%; height: 80px; background: rgba(2,6,23,0.72); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 40px; z-index: 100; }
    .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-primary); font-weight: 800; font-size: 14px; }
    .brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--brand-primary), var(--bright-cyan)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--bg-primary); }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 14px; }
    .nav-links a.active { color: var(--bright-cyan); }
    
    .container { max-width: 800px; margin: 120px auto 60px; padding: 0 20px; }
    .form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; backdrop-filter: blur(20px); }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-secondary); }
    input, select, textarea { width: 100%; background: #020617; border: 1px solid var(--border); color: var(--text-primary); padding: 12px; border-radius: 8px; font-size: 14px; }
    input:focus, select:focus, textarea:focus { border-color: var(--brand-primary); outline: none; }
    .submit-btn { width: 100%; background: linear-gradient(135deg, var(--brand-primary), var(--bright-cyan)); color: var(--bg-primary); padding: 16px; border: none; border-radius: 8px; font-weight: 800; font-size: 15px; cursor: pointer; transition: all 0.3s; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-brand">
      <div class="brand-icon">QO</div>
      <div>QUANTUM OPS <span style="color:var(--bright-cyan)">ELITE</span></div>
    </a>
    <ul class="nav-links">
      <li><a href="platform.html">Platform</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="work.html">Work</a></li>
      <li><a href="academy.html">Academy</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    <div style="text-align: center; margin-bottom: 40px;">
      <h1 style="font-size: 36px; margin-bottom: 12px;">HAVE A PROBLEM WORTH SOLVING?</h1>
      <p style="color: var(--text-secondary);">Tell us what you want to build. We'll design the right digital system around your business.</p>
    </div>

    <div class="form-card" id="form-container">
      <form id="project-form">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label>Your Name *</label>
            <input type="text" id="name" required />
          </div>
          <div class="form-group">
            <label>Business Name</label>
            <input type="text" id="business_name" />
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label>Email Address *</label>
            <input type="email" id="email" required />
          </div>
          <div class="form-group">
            <label>Phone / WhatsApp *</label>
            <input type="text" id="phone" required />
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label>Business Type</label>
            <input type="text" id="business_type" placeholder="e.g. Retail, Agency, Logistics" />
          </div>
          <div class="form-group">
            <label>Project Type</label>
            <select id="project_type">
              <option value="Business Platform">Business Platform</option>
              <option value="Custom Website">Custom Website</option>
              <option value="Dashboard">Dashboard</option>
              <option value="E-Commerce">E-Commerce</option>
              <option value="Academy Enrollment">Academy Enrollment</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label>Budget Range</label>
            <select id="budget">
              <option value="Standard">Standard</option>
              <option value="Growth">Growth System</option>
              <option value="Enterprise">Enterprise Solution</option>
            </select>
          </div>
          <div class="form-group">
            <label>Timeline</label>
            <input type="text" id="timeline" placeholder="e.g. 2-4 weeks" />
          </div>
        </div>

        <div class="form-group">
          <label>Project Details / Message *</label>
          <textarea id="message" rows="5" required></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">START MY PROJECT</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('project-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "TRANSMITTING DATA...";

      const requestPayload = {
        name: document.getElementById('name').value,
        business_name: document.getElementById('business_name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        business_type: document.getElementById('business_type').value,
        project_type: document.getElementById('project_type').value,
        budget: document.getElementById('budget').value,
        timeline: document.getElementById('timeline').value,
        message: document.getElementById('message').value
      };

      const { data, error } = await supabaseClient
        .from('project_requests')
        .insert([requestPayload]);

      if (!error) {
        document.getElementById('form-container').innerHTML = `
          <div style="text-align: center; padding: 40px 0;">
            <h2 style="color: var(--bright-cyan); margin-bottom: 12px;">REQUEST LOGGED SUCCESSFULLY</h2>
            <p style="color: var(--text-secondary);">Your parameters have been logged into Quantum Ops. Our team will contact you shortly.</p>
          </div>
        `;
      } else {
        alert("Transmission error: " + error.message);
        submitBtn.disabled = false;
        submitBtn.innerText = "START MY PROJECT";
      }
    });
  </script>
</body>
</html>
